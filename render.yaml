# render.yaml – repository root
services:
  # ---------- Backend (FastAPI) ----------
  - type: web
    name: predictive-maintenance-api
    env: python
    plan: free
    # (optional) force a specific Python version
    runtime: python3.12
    buildCommand: |
      pip install -r requirements.txt
    startCommand: uvicorn main:create_api_server --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        value: https://predictive-maintenance-api-<YOUR_ID>.onrender.com   # Render fills <YOUR_ID> automatically
      - key: MONGODB_URI
        fromSecret: MONGODB_URI          # create this secret on Render (next step)
      - key: DATABASE_NAME
        value: predictive_maintenance
    healthCheckPath: /health

  # ---------- Front‑end (Vite static site) ----------
  - type: static
    name: predictive-maintenance-frontend
    env: static
    plan: free
    buildCommand: |
      cd frontend
      npm ci
      npm run build            # outputs ./dist
    publishPath: frontend/dist   # Vite default output folder
    envVars:
      - key: VITE_API_URL
        value: https://predictive-maintenance-api-<YOUR_ID>.onrender.com
